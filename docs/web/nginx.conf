# play.thaira2.com: the YuriNET Launcher, served under /emu/.
#
#   web/dist/* (from `pnpm build`) -> /var/www/thaira2.com/httpdocs-play/emu/
#   the page is built for this base: RA2_BASE=/emu/ in web/.env.production
#
# Clean routes: /emu/, /emu/game/1 and /emu/import return the app's HTML; a real
# file under /emu/ (game module, asset, icon, font, build.json) is served as it
# is. See docs/web/deploy.md.

server {
        listen 80;
        listen [::]:80;
        # TLS: listen 443 ssl; ssl_certificate ...; or terminate in front.
        server_name play.thaira2.com;

        root /var/www/thaira2.com/httpdocs-play;
        index index.html;
        autoindex off;
        charset utf-8;

        # Threads (SharedArrayBuffer) need a cross-origin isolated page. With
        # these, the service worker has nothing to add and the page needs no
        # isolation reload (docs/web/deploy.md, "Headers").
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
        gzip_vary on;

        location ~* \.js\.map$ {
                default_type application/json;
        }

        # If nothing else lives at the docroot, send the host name itself to the
        # launcher:  location = / { return 302 /emu/; }

        # /emu is outside the worker's scope (/emu/), so send it there.
        location = /emu {
                return 301 /emu/;
        }

        # The launcher and its clean routes. Anything that is not a file is the
        # app, and the router takes it from there.
        location /emu/ {
                try_files $uri $uri/ /emu/index.html;

                # The page, the game modules and build.json keep their names
                # across deploys: let the browser revalidate them.
                expires -1;
        }

        # Vite's asset names carry a content hash: a new build is a new name.
        location /emu/assets/ {
                expires 1y;
        }

        # The worker decides when the page and the game's files update.
        location = /emu/sw.js {
                expires -1;
        }

        # Streaming compilation wants application/wasm. The build writes .br
        # (Brotli quality 9) and .gz (gzip level 9) sidecars; enable the module
        # the host has, keeping the identity file as the fallback:
        #   brotli_static on;   (ngx_brotli)
        #   gzip_static on;     (not built into every nginx)
        # Dynamic gzip of a 100+ MB module costs more than it saves: it is not
        # in gzip_types.
        location ~ ^/emu/game/.*\.wasm$ {
                types {
                        application/wasm wasm;
                }
                default_type application/wasm;
                expires -1;
                # brotli_static on;
                # gzip_static on;
        }

        location = /emu/manifest.webmanifest {
                types {
                        application/manifest+json webmanifest;
                }
                default_type application/manifest+json;
        }

        # No PHP on this vhost: never hand out a leftover .php file's source.
        location ~ \.php$ {
                return 404;
        }

        # Deny access to .htaccess
        location ~ /\.ht {
                deny all;
        }
}
